<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project timelines</title>
<style>
html, body { margin: 0; height: 100%; background: #f4f1ea; }
iframe { border: 0; width: 100%; height: 100%; display: block; }
#ld { font: 14px system-ui; color: #666; padding: 24px; }
</style>
</head>
<body>
<div id="ld">Loading timeline&#8230;</div>
<iframe id="f" title="Gantt chart" style="display:none"></iframe>
<script>
var SRC = "https://wouvkkaxehwuhtgpersx.supabase.co/functions/v1/shared/09b3dbcb-ca6b-4bca-bdc8-f0243049ac30?raw=1";
fetch(SRC, { cache: "no-store" })
  .then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error(t || ("HTTP " + r.status)); });
    return r.text();
  })
  .then(function (h) {
    var f = document.getElementById("f");
    f.srcdoc = h;
    f.style.display = "block";
    document.getElementById("ld").remove();
  })
  .catch(function (e) {
    document.getElementById("ld").textContent = "Could not load the chart: " + e.message + " — refresh to retry.";
  });
</script>
</body>
</html>
